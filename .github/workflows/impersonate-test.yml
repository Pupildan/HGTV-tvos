name: Impersonate TLS fingerprint test

# 目的：用项目真实 V5 签名链路（Scripts/sign_cli.swift → SignInterceptor/HCSignerV5）
# 生成 landpage 请求，再用 curl-impersonate 的 Chrome 指纹模板发送，
# 验证「字节 CDN 黑名单 Apple TLS 栈 JA3/JA4、OpenSSL/curl 指纹可过」假说。
# 独立 job：不触碰主构建（build-tvos.yml）的任何步骤。
on:
  push:
    branches: [main]
    paths:
      - 'impersonate-test.yml'
      - 'Sources/HGTVCore/**'
      - 'Package.swift'
      - 'Scripts/sign_cli.swift'
  workflow_dispatch:
  # 2026-11-24：恢复 push 触发（Sources/** 变更自动跑 tvOS typecheck 快速反馈环，
  # swiftc 的错误完整输出不被 Actions 吞——主构建的 frontend 错误会丢）。
  # curl-impersonate 指纹验证目的已达成（curl_cffi 归一实验）。

concurrency:
  group: impersonate-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impersonate-test:
    name: curl-impersonate TLS fingerprint test
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install curl-impersonate (brew) + curl_cffi fallback
        run: |
          echo "=== brew install curl-impersonate ==="
          brew install curl-impersonate || echo "WARN: brew formula curl-impersonate failed, fallback to pip curl_cffi"
          PREFIX="$(brew --prefix)"
          echo "=== curl_chrome* wrappers installed ==="
          ls "$PREFIX/bin" | grep -E '^curl_(chrome|ff|safari|edge)' || echo "(none — release binary fallback skipped, curl_cffi below)"
          echo "=== curl_cffi (curl-impersonate python binding, chrome131_android template) ==="
          python3 -m pip install --quiet --upgrade curl_cffi || echo "WARN: curl_cffi install failed"
          python3 -c "import curl_cffi; print('curl_cffi version:', curl_cffi.__version__)" || true

      - name: Compile sign CLI (swiftc, HGTVCore minimal whole-target)
        run: |
          mkdir -p build
          xcrun swiftc -O -target arm64-apple-macosx13.0 -o build/sign_cli Scripts/sign_cli.swift $(find Sources/HGTVCore -name '*.swift' | sort)
          ls -la build/sign_cli

      - name: Typecheck HGTVCore for tvOS (CurlShim module + brew curl headers — 完整错误输出)
        run: |
          CURL_INC="$(brew --prefix)/include"
          echo "curl headers: $CURL_INC/curl/curl.h"
          ls "$CURL_INC/curl/" | head -8 || true
          xcrun swiftc -typecheck \
            -target arm64-apple-tvos26.0 \
            -sdk "$(xcrun --sdk appletvos --show-sdk-path)" \
            -I "$CURL_INC" \
            -I Vendor/CurlShim \
            $(find Sources/HGTVCore -name '*.swift' | sort) 2>&1 | head -60

      - name: Generate signed landpage request
        run: |
          ./build/sign_cli request.json
          python3 - <<'PY'
          import base64, json
          d = json.load(open('request.json'))
          print('URL:', d['url'][:150], '...')
          print('headers:', sorted(d['headers'].keys()))
          body = base64.b64decode(d['body_base64'])
          print('body gz bytes:', len(body))
          PY

      - name: Send with impersonation templates + verdict
        run: python3 Scripts/send_impersonate.py

      - name: Print verdict
        if: always()
        run: |
          if [ -f impersonate_result.json ]; then
            python3 -c "import json; d=json.load(open('impersonate_result.json')); print('VERDICT:', d['verdict']); [print(' ', r) for r in d['results']]"
          else
            echo "impersonate_result.json missing — job execution error"
          fi

      - name: Upload impersonate-test-result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impersonate-test-result
          path: |
            impersonate_result.json
            request.json
            body.gz
            resp_*.bin
            hdr_*.txt
          if-no-files-found: warn
          retention-days: 7
  # AsyncHTTPClient（BoringSSL）传输层验证：sign_cli --transport nio 直接在 CI 上发
  # 签名后的 landpage（V5 签名链路与 app 完全同路径）。macOS runner 的 AsyncHTTPClient
  # TLS 栈即 BoringSSL——验证「BoringSSL 指纹 + 签名请求」真实过墙（status=200 + TLS
  # 握手成功 = 指纹未被 TLS 层拦截；海外出口可能因地域风控仍 0B，真数据需中国出口真机）。
  nio-transport-test:
    name: AsyncHTTPClient (BoringSSL) transport test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SignCLI via SwiftPM (pulls AsyncHTTPClient + BoringSSL)
        run: |
          if ! swift build -c release --target SignCLI > build_signcli.log 2>&1; then
            echo "=== swift build FAILED — error lines: ==="
            grep -E "error:" build_signcli.log | head -40 || true
            echo "=== last 60 lines: ==="
            tail -60 build_signcli.log
            exit 1
          fi
          echo "=== swift build OK ==="
          BIN_PATH="$(swift build -c release --target SignCLI --show-bin-path)"
          echo "BIN_PATH=$BIN_PATH" >> "$GITHUB_ENV"
          ls -la "$BIN_PATH/SignCLI"

      - name: Sign + send landpage via NIO (BoringSSL)
        run: |
          "$BIN_PATH/SignCLI" --transport nio nio_request.json
          echo "--- nio_result.json ---"
          cat nio_result.json || true

      - name: Upload nio-transport-test-result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nio-transport-test-result
          path: |
            nio_result.json
            nio_request.json
          if-no-files-found: warn
          retention-days: 7