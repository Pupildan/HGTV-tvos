name: Build tvOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 并发保护：同一分支新提交时取消旧构建
concurrency:
  group: build-tvos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned tvOS ipa
    runs-on: macos-latest   # macOS 26 arm64，带最新 Xcode
    timeout-minutes: 40
    permissions:
      contents: write   # 构建成功后要 bump VERSION 并 push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose environment
        run: |
          echo "=== runner ==="
          uname -a
          sw_vers
          echo "=== Xcode versions installed ==="
          ls /Applications | grep -i xcode || echo "(no Xcode_* dirs)"
          xcodebuild -version
          echo "=== sdks ==="
          xcodebuild -showsdks 2>/dev/null | grep -i tvos || true

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          else
            sudo xcode-select -s "$(xcode-select -p)"
          fi
          xcodebuild -version
          swift --version

      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build + package unsigned ipa
        env:
          # 版本号：来自仓库 VERSION 文件（自然数 v1/v2/v3…），构建成功后自动 +1 写回
          HGTV_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x Scripts/build_ipa.sh Scripts/stamp_version.sh
          set -o pipefail
          ./Scripts/build_ipa.sh 2>&1 | tee build_output.log
          # 构建后处理：把 v{N} 写进 Info.plist 并重命名为 HGTV-tvOS-v{N}-unsigned.ipa
          ./Scripts/stamp_version.sh 2>&1 | tee -a build_output.log

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: build_output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unsigned ipa artifact
        uses: actions/upload-artifact@v4
        with:
          # ipa 命名规范：HGTV-tvOS-v{N}-unsigned.ipa（stamp_version.sh 产出），artifact 名同步带版本
          name: HGTV-tvOS-v${{ steps.ver.outputs.version }}-unsigned
          path: dist/HGTV-tvOS-v*-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Bump version for next build
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEXT=$(( $(cat VERSION) + 1 ))
          echo "$NEXT" > VERSION
          git add VERSION
          git commit -m "chore: bump version to v${NEXT} [skip ci]"
          git push