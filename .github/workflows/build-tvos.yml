name: Build tvOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 并发保护：同一分支新提交时取消旧构建
concurrency:
  group: build-tvos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # —— libcurl-impersonate tvOS 静态库编译（主构建前置依赖）——
  # lexiforest/curl-impersonate（curl_cffi 同源实现，活跃维护）CMake superbuild：
  # 自动下载并构建 BoringSSL + nghttp2/ngtcp2/nghttp3 + brotli/zstd/zlib/c-ares +
  # curl 8.23（impersonate patch，39 个浏览器预设内建）。tvOS 交叉编译走
  # CMAKE_SYSTEM_NAME=iOS + appletvos SDK + arm64（cmake 官方 Apple 交叉做法，
  # lexiforest 顶层 CMakeLists 对 iOS 系统名有专门处理并把工具链参数传播到全部
  # 子项目）。证书校验走 Apple SecTrust（USE_APPLE_SECTRUST，tvOS 系统信任库），
  # 无需打包 cacert.pem。产物 tar.gz：include/ 头 + 合并静态库 libcurl-imp-tvos.a。
  build-curl-impersonate:
    name: Build libcurl-impersonate (tvOS arm64, chrome131_android)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go (BoringSSL 编译硬依赖)
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build tvOS static lib (cross-compile)
        run: |
          chmod +x Scripts/build_curl_impersonate.sh
          ./Scripts/build_curl_impersonate.sh

      - name: Upload curl-impersonate bundle
        uses: actions/upload-artifact@v4
        with:
          name: curl-impersonate-tvos
          path: curl-impersonate-tvos.tar.gz
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build unsigned tvOS ipa
    needs: build-curl-impersonate
    runs-on: macos-latest   # macOS 26 arm64，带最新 Xcode
    timeout-minutes: 40
    permissions:
      contents: write   # 构建成功后要 bump VERSION 并 push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch + extract curl-impersonate bundle
        uses: actions/download-artifact@v4
        with:
          name: curl-impersonate-tvos
          path: Vendor/curl-imp

      - name: Verify curl-impersonate bundle
        run: |
          tar xzf Vendor/curl-imp/curl-impersonate-tvos.tar.gz -C Vendor/curl-imp
          echo "=== bundle layout ==="
          find Vendor/curl-imp -maxdepth 2 | head -40
          echo "=== merged archive architectures ==="
          lipo -info Vendor/curl-imp/lib/libcurl-imp-tvos.a
          echo "=== impersonate symbols (must include curl_easy_impersonate) ==="
          nm -gU Vendor/curl-imp/lib/libcurl-imp-tvos.a 2>/dev/null \
            | grep -E '_curl_easy_(init|impersonate|setopt|perform)$' | head -8
          cat Vendor/curl-imp/share/BUNDLE_INFO.txt

      - name: Diagnose environment
        run: |
          echo "=== runner ==="
          uname -a
          sw_vers
          echo "=== Xcode versions installed ==="
          ls /Applications | grep -i xcode || echo "(no Xcode_* dirs)"
          xcodebuild -version
          echo "=== sdks ==="
          xcodebuild -showsdks 2>/dev/null | grep -i tvos || true

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          else
            sudo xcode-select -s "$(xcode-select -p)"
          fi
          xcodebuild -version
          swift --version

      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build + package unsigned ipa
        env:
          # 版本号：来自仓库 VERSION 文件（自然数 v1/v2/v3…），构建成功后自动 +1 写回
          HGTV_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x Scripts/build_ipa.sh Scripts/stamp_version.sh
          set -o pipefail
          ./Scripts/build_ipa.sh 2>&1 | tee build_output.log
          # 构建后处理：把 v{N} 写进 Info.plist 并重命名为 HGTV-tvOS-v{N}-unsigned.ipa
          ./Scripts/stamp_version.sh 2>&1 | tee -a build_output.log

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: build_output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unsigned ipa artifact
        uses: actions/upload-artifact@v4
        with:
          # ipa 命名规范：HGTV-tvOS-v{N}-unsigned.ipa（stamp_version.sh 产出），artifact 名同步带版本
          name: HGTV-tvOS-v${{ steps.ver.outputs.version }}-unsigned
          path: dist/HGTV-tvOS-v*-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Bump version for next build
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEXT=$(( $(cat VERSION) + 1 ))
          echo "$NEXT" > VERSION
          git add VERSION
          git commit -m "chore: bump version to v${NEXT} [skip ci]"
          git push