name: Build tvOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned tvOS ipa
    runs-on: macos-latest   # macOS 26 arm64（文档确认有效标签），带最新 Xcode
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose environment
        run: |
          echo "=== runner ==="
          uname -a
          sw_vers
          echo "=== Xcode versions installed ==="
          ls /Applications | grep -i xcode || echo "(no Xcode_* dirs)"
          xcodebuild -version
          echo "=== sdks ==="
          xcodebuild -showsdks 2>/dev/null | grep -i tvos || true

      - name: Select Xcode
        run: |
          # 优先 Xcode 26，退回默认
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          else
            sudo xcode-select -s "$(xcode-select -p)"
          fi
          xcodebuild -version
          swift --version

      - name: Build + package unsigned ipa
        run: |
          chmod +x Scripts/build_ipa.sh
          set -o pipefail
          ./Scripts/build_ipa.sh 2>&1 | tee build_output.log

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: build_output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unsigned ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: HGTV-tvOS-unsigned
          path: dist/HGTV-tvOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30