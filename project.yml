# project.yml — xcodegen 声明式生成 tvOS app 工程
# CI 里用 `xcodegen generate` 产出 HGTV.xcodeproj，再 xcodebuild archive。
# 关键：app target **直接编译 Swift 源文件**（Sources/HGTVApp + Sources/HGTVCore），
# 不依赖 SwiftPM 包——这样 archive 必定产出规范的 tvOS .app（此前链接 SwiftPM
# library product 会让产物走 usr/local/bin，archive 里拿不到 .app）。
name: HGTV
options:
  bundleIdPrefix: com.hgtv
  deploymentTarget:
    tvOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SDKROOT: appletvos
    TARGETED_DEVICE_FAMILY: "3"
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.3.7.3"
    CURRENT_PROJECT_VERSION: "78"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  HGTV:
    type: application
    platform: tvOS
    sources:
      # 直接编译界面层 + 数据层源码（含 @main 入口 HGTVApp.swift）
      - Sources/HGTVApp
      - Sources/HGTVCore
      - path: tvOS
        type: folder
        buildPhase: none   # Info.plist 单独引用，不当作资源
    info:
      path: tvOS/Info.plist
      properties:
        CFBundleDisplayName: HGTV
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hgtv.star.tvos
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: tvOS/Info.plist
        PRODUCT_NAME: HGTV