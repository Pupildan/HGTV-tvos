# project.yml — xcodegen 声明式生成 tvOS app 工程
# CI 里用 `xcodegen generate` 产出 HGTV.xcodeproj，再 xcodebuild archive。
# 结构：
#   - HGTVCore  ：数据获取层（签名/设备注册/网络/接口/模型），独立 module，供 app import
#   - HGTV      ：tvOS app target，编译界面层源码（含 @main 入口），依赖并 embed HGTVCore
# 直接编译源文件（不依赖 SwiftPM 包），archive 必产出规范 tvOS .app。
name: HGTV
options:
  bundleIdPrefix: com.hgtv
  deploymentTarget:
    tvOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SDKROOT: appletvos
    TARGETED_DEVICE_FAMILY: "3"
    SWIFT_VERSION: "5.0"
    OTHER_SWIFT_FLAGS: "-strict-concurrency=minimal"
    MARKETING_VERSION: "1.3.7.3"
    CURRENT_PROJECT_VERSION: "78"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  # 数据获取层，独立 framework module，app 通过 import HGTVCore 使用
  HGTVCore:
    type: framework
    platform: tvOS
    sources:
      - Sources/HGTVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hgtv.star.tvos.core
        PRODUCT_NAME: HGTVCore
        GENERATE_INFOPLIST_FILE: YES
  # tvOS app，编译界面层（含 @main），依赖 HGTVCore
  HGTV:
    type: application
    platform: tvOS
    sources:
      - Sources/HGTVApp
      - path: tvOS/Assets.xcassets   # 图标 catalog 单独引用（xcodegen 自动进 Resources build phase，actool 编译）
      - path: tvOS
        type: folder
        buildPhase: none   # Info.plist 单独引用，不当作资源
    dependencies:
      - target: HGTVCore
        embed: true
    info:
      path: tvOS/Info.plist
      properties:
        CFBundleDisplayName: Nbeedp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hgtv.star.tvosdp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: tvOS/Info.plist
        PRODUCT_NAME: HGTV